name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Write credentials.ts
        run: |
          cat > src/credentials.ts <<'EOF'
          export const firebaseConfig = {
            apiKey: '${{ secrets.FIREBASE_API_KEY }}',
            authDomain: 'ubb-spel-aebae.firebaseapp.com',
            projectId: 'ubb-spel-aebae',
            storageBucket: 'ubb-spel-aebae.appspot.com',
            messagingSenderId: '395492793253',
            appId: '1:395492793253:web:2a30e88d78082de191e64c'
          }
          EOF

      - run: npm ci
      - run: npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_UBB_SPEL_AEBAE }}'
          channelId: live
          projectId: ubb-spel-aebae
