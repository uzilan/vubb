<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 3 224 302" width="224" height="302">
  <defs>
    <linearGradient id="cardBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a5db0"/>
      <stop offset="100%" stop-color="#173d7a"/>
    </linearGradient>
    <pattern id="diamonds" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="20" height="20" fill="none"/>
      <rect x="4" y="4" width="12" height="12" fill="#ffffff" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- back card -->
  <g transform="translate(18,26) rotate(-6 90 130)">
    <rect x="0" y="0" width="180" height="260" rx="14" fill="#0f2c5c"/>
    <rect x="4" y="4" width="172" height="252" rx="11" fill="url(#cardBack)"/>
    <rect x="4" y="4" width="172" height="252" rx="11" fill="url(#diamonds)"/>
    <rect x="14" y="14" width="152" height="232" rx="7" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
  </g>

  <!-- middle card -->
  <g transform="translate(30,14) rotate(4 90 130)">
    <rect x="0" y="0" width="180" height="260" rx="14" fill="#0f2c5c"/>
    <rect x="4" y="4" width="172" height="252" rx="11" fill="url(#cardBack)"/>
    <rect x="4" y="4" width="172" height="252" rx="11" fill="url(#diamonds)"/>
    <rect x="14" y="14" width="152" height="232" rx="7" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
  </g>

  <!-- front card -->
  <g transform="translate(30,40)">
    <rect x="0" y="0" width="180" height="260" rx="14" fill="#0f2c5c"/>
    <rect x="4" y="4" width="172" height="252" rx="11" fill="url(#cardBack)"/>
    <rect x="4" y="4" width="172" height="252" rx="11" fill="url(#diamonds)"/>
    <rect x="14" y="14" width="152" height="232" rx="7" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2"/>
    <circle cx="90" cy="130" r="42" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3"/>
    <circle cx="90" cy="130" r="20" fill="#ffffff" fill-opacity="0.25"/>
  </g>
</svg>
